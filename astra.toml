# スクリプト（@FlowType_H.anm2）の生成だけに使う（astra 0.7.1 以降。設定形式 version 2）。
#   python build_scripts.py   astra build effect --release → 検査 → 配置
# プラグイン（.aux2）と配布物（au2pkg）は aviutl2.toml / build.ps1 の担当なので、ここには書かない。
version = 2

[astra]
requires_astra = ">=0.7.0"

[project]
name = "FlowType_H"
version = "0.3.0"
authors = ["Korarei"]
requires_aviutl2 = "2011100"

# 出力: build/effect/release/@FlowType_H.anm2（見出しは各ソースの先頭行 --@モーション などから作られる）
[builds.effect]
suffix = ".anm2"
include_dirs = ["scripts/effects/shaders"]
vars = { LABEL = "HexScript" }
targets = [
    { path = "scripts/effects/motion.lua" },
    { path = "scripts/effects/island.lua" },
    { path = "scripts/effects/kerning.lua" },
    { path = "scripts/effects/repeat.lua" },
    { path = "scripts/effects/blink.lua" },
    { path = "scripts/effects/echo.lua" },
]

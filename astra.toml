[astra]
requires-astra = ">=0.6.4"

[project]
name = "FlowType_H"
version = "0.3.0"
author = "Korarei"
requires-aviutl2 = "2011100"

[build]
[[build.plugins]]
id = "core"
shell = "pwsh"
variables = { SOURCE = "./plugins" }

[build.plugins.release]
commands = '''
$dst = "$env:BUILD_DIRECTORY/Release"
cmake -S "$env:SOURCE" -B "$dst" --preset release -DREQUIRES_AVIUTL2="$env:PROJECT_REQUIRES_AVIUTL2" -DVERSION="$env:PROJECT_VERSION"
cp "$dst/compile_commands.json" "$env:SOURCE"
cmake --build "$dst"
'''
artifacts = ["${BUILD_DIRECTORY}/Release/*.aux2"]

[build.plugins.debug]
commands = '''
$dst = "$env:BUILD_DIRECTORY/Debug"
cmake -S "$env:SOURCE" -B "$dst" --preset debug -DREQUIRES_AVIUTL2="$env:PROJECT_REQUIRES_AVIUTL2"
cp "$dst/compile_commands.json" "$env:SOURCE"
cmake --build "$dst"
'''
artifacts = ["${BUILD_DIRECTORY}/Debug/*.aux2"]

[[build.scripts]]
id = "effect"
prefix = "@"
suffix = ".anm2"
variables = { SOURCE = "./scripts/effects", LABEL = "HexScript" }
include-directories = ["${SOURCE}/shaders"]
sources = [
    { file = "${SOURCE}/motion.lua" },
    { file = "${SOURCE}/island.lua" },
    { file = "${SOURCE}/kerning.lua" },
    { file = "${SOURCE}/repeat.lua" },
    { file = "${SOURCE}/blink.lua" },
    { file = "${SOURCE}/echo.lua" },
]

[release]
[release.package]
information = "${PROJECT_NAME} v${PROJECT_VERSION} by ${PROJECT_AUTHOR}"
license = "MIT"
website = "https://github.com/HexBrowns/FlowType_H"
report-issue = "https://github.com/HexBrowns/FlowType_H/issues"
summary = "AviUtl ExEdit2向けテキストアニメーション作成支援ツール"
description = """
以下の機能が追加される

アニメーション効果

- HexScript\\モーション@FlowType_H: 全自動リリックモーション
- HexScript\\パーツ分解@FlowType_H: パーツ分解
- HexScript\\カーニング@FlowType_H: 全自動カーニング
- HexScript\\リピート@FlowType_H: 高機能画像ループ
- HexScript\\トリミング@FlowType_H: 余白除去
- HexScript\\変形@FlowType_H: 変形
- HexScript\\整列@FlowType_H: 整列
- HexScript\\トランスフォーム@FlowType_H: 座標変換
- HexScript\\点滅@FlowType_H: 点滅
- HexScript\\残像@FlowType_H: 残像

オブジェクトメニュー (オブジェクトを右クリック)

- FlowType_H\\テキストを文字ごとに分解: テキスト分解

プロパティメニュー (オブジェクト設定項目を右クリック)

- FlowType_H\\現在値で上書き: 現在値を指定した区間にコピー
- FlowType_H\\値を反転: 指定した区間の値を反転 (符号，ON/Off)
- FlowType_H\\プロパティ名をコピー: 指定した形式でプロパティ名をクリップボードへコピー
- FlowType_H\\参照式をコピー: 参照式をクリップボードへコピー

- FlowType_H\\エフェクトをコピー: 指定した形式でエフェクト情報をクリップボードへコピー
"""

[[release.contents.extensions]]
directory = "Plugin/${PROJECT_NAME}"
files = ["plugin:core"]

[[release.contents.extensions]]
directory = "Script/${PROJECT_NAME}"
files = ["script:effect"]

[[release.contents.extensions]]
directory = "Preset"
files = ["./presets/*.preset"]

[[release.contents.documents]]
directory = "Script/${PROJECT_NAME}"
files = ["./*.md", "./LICENSE"]
